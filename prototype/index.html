<script src="https://cdn.tailwindcss.com"></script>
<script>

  tailwind.config = {
    theme: { extend: { colors: {
      ink: { 950:'#0b1120', 900:'#101828', 800:'#1a2438', 700:'#253046', 600:'#344259' },
      accent: { 300:'#7dd8c5', 400:'#45c4a8', 500:'#17a583', 600:'#0d8168' },
    }, fontFamily: { sans: ['Avenir Next','Segoe UI','ui-sans-serif','system-ui','sans-serif'] } } },
  }
</script>
<style type="text/tailwindcss">
  @layer components {
    .card { @apply bg-ink-900 border border-ink-700 rounded-xl; }
    .input { @apply w-full bg-ink-950 border border-ink-600 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-accent-500; }
    .btn-primary { @apply inline-flex items-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium bg-accent-500 text-ink-950 hover:bg-accent-400 cursor-pointer; }
    .btn-ghost { @apply inline-flex items-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium bg-transparent border border-ink-600 text-slate-300 hover:border-accent-500 hover:text-accent-300 cursor-pointer; }

</style>
</head>

          <span class="text-slate-500">— Harrow Goods, waiting for your OK</span>

<template id="tpl-queue">
  <div class="space-y-4">

      <button class="rounded-lg px-3.5 py-1.5 text-sm text-slate-400 hover:text-slate-200">Replies</button>

    <div class="flex items-center justify-between gap-3 flex-wrap">
      <p class="text-sm text-slate-400">Nothing goes out until you say so.</p>
      <button class="btn-ghost">Send both emails</button>
    </div>

    <!-- APPROVE: an email Harry can send itself -->
    <section class="card p-4 space-y-3">
      <div class="flex items-baseline gap-2 flex-wrap text-sm">
        <span class="chip border-accent-600/40 text-accent-300">Email</span>
        <span class="text-slate-500">To</span>
        <span class="font-medium text-slate-200">Priya Naidu</span>
        <span class="text-slate-400">· Boxfresh, Head of Operations</span>
        <span class="ml-auto text-[11px] text-slate-600">written 12m ago</span>
      </div>
      <div class="rounded-lg border border-accent-600/30 bg-accent-500/10 p-3 text-sm">
        <div class="text-xs text-accent-300 mb-1">She said</div>
        <div class="text-slate-300">Happy to introduce you — send me two lines I can forward.</div>

        <div class="font-medium text-slate-200">Re: Quick favour</div>

Sam Reid is doing an operations assessment this term and is looking for one business to study. It's about an hour of your time and you get the written findings, free.

Forward whenever suits. If it turns out to be awkward, no problem at all.

Sam</div>

      </div>

    </section>

    <!-- DO: a channel Harry cannot send on -->
    <section class="card p-4 space-y-3">
      <div class="flex items-baseline gap-2 flex-wrap text-sm">
        <span class="chip border-sky-700/50 text-sky-300">LinkedIn</span>
        <span class="text-slate-500">To</span>
        <span class="font-medium text-slate-200">Tom Harrow</span>
        <span class="text-slate-400">· Harrow Goods, Founder</span>
        <span class="ml-auto text-[11px] text-slate-600">you send this one</span>
      </div>
      <div class="text-xs text-slate-500">Step 2 — he accepted your connection request on Tuesday.</div>
      <div class="rounded-lg border border-ink-700 bg-ink-950 p-4">

It's about an hour, and you'd get the written findings. Not for you? Just say and I'll leave it.</div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button class="btn-primary">Copy and open LinkedIn</button>
        <button class="btn-ghost">Mark as sent</button>
        <span class="ml-auto text-xs text-slate-500 hover:text-red-400 cursor-pointer">Skip this one</span>
      </div>
      <p class="text-[11px] text-slate-600">
        Harry never signs in to LinkedIn for you. You paste and send, then tell it what happened —

    </section>

    <!-- DO: contribute-first -->
    <section class="card p-4 space-y-3">
      <div class="flex items-baseline gap-2 flex-wrap text-sm">
        <span class="chip border-slate-600 text-slate-400">Comment</span>
        <span class="text-slate-500">On</span>
        <span class="font-medium text-slate-200">Jess Okafor's post</span>
        <span class="text-slate-400">· Coastal Supply</span>
      </div>

      <div class="flex items-center gap-2">

        <button class="btn-ghost">Mark as done</button>
      </div>

<template id="tpl-setup">
  <div class="space-y-5 max-w-2xl">

      <p class="text-sm text-slate-400">One sentence is enough. You can come back to the rest later.</p>
      <textarea id="ask" class="input min-h-24 text-[15px]" placeholder="One business that will let me study their fulfilment process for my operations assessment this term."></textarea>
      <div class="flex justify-end">
        <button class="btn-primary">Save and start</button>
      </div>
    </section>

    <details class="card p-5">
      <summary class="text-sm font-medium text-slate-200 cursor-pointer">Add more detail — makes every email sharper</summary>
      <div class="mt-4 space-y-4">
        <div>
          <label class="block text-sm text-slate-300">Who is asking</label>

          <textarea class="input min-h-16 text-[13px]" placeholder="Sam Reid, final-term operations student. Eight years running warehouse teams before I went back to study."></textarea>

          <span class="block text-sm text-slate-300 mb-1.5">How it should sound</span>
          <div class="flex gap-1.5">
            <button class="chip border-accent-500 bg-accent-500/10 text-accent-300">Direct</button>
            <button class="chip">Warm</button>
            <button class="chip">Formal</button>
          </div>
        </div>
      </div>
    </details>

    <section class="card p-5 space-y-4">
      <h2 class="font-semibold text-slate-200">Sending</h2>
      <div class="flex items-start gap-4">
        <div class="flex-1">
          <div class="text-sm text-slate-300">Show me every message before it goes</div>
          <p class="text-xs text-slate-500 mt-1">Your name is on it, so you send it.</p>
        </div>
        <div class="h-6 w-11 shrink-0 rounded-full bg-accent-500 relative">
          <span class="absolute top-0.5 right-0.5 block size-5 rounded-full bg-white"></span>
        </div>
      </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Send between</label>
          <input type="time" class="input w-auto" value="08:30" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">and</label>
          <input type="time" class="input w-auto" value="17:30" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">on</label>
          <select class="input w-auto"><option>weekdays</option><option>every day</option></select>
        </div>
      </div>
      <p class="text-xs text-slate-500">Times taken from this browser. Nothing to pick.</p>
    </section>

    <section class="card p-5 space-y-3">
      <h2 class="font-semibold text-slate-200">Your coach</h2>
      <p class="text-sm text-slate-400">
        Dan Whitmore can read and approve anything before it sends, and can open doors for you.
      </p>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-slate-200">dan.whitmore@squadinstitute.edu</span>
        <span class="chip border-emerald-700/50 text-emerald-300">active</span>

    </section>

<script>
  const PAGES = [
    { id:'today',  label:'Today' },
    { id:'queue',  label:'Needs you', badge:3 },
    { id:'people', label:'People' },
    { id:'proof',  label:'Proof' },
    { id:'setup',  label:'Setup' },
  ]

  // Full class strings, never interpolated — Tailwind cannot see `text-${x}-300`.
  const STAGE = {
    agreed: 'text-emerald-300',
    contacted: 'text-sky-300',
    replied: 'text-indigo-300',
    'not contacted': 'text-slate-500',
    '—': 'text-slate-600',
  }

  const PEOPLE = [
    ['Priya Naidu','Boxfresh · Head of Operations','Same cohort, 2024','agreed'],
    ['Tom Harrow','Harrow Goods · Founder','Placement supervisor','contacted'],
    ['Jess Okafor','Coastal Supply · Ops Manager','No path yet','not contacted'],
    ['Dan Whitmore','SquadInstitute · Coach','Your coach','—'],
    ['Marcus Bell','Northwind · Logistics Lead','Alumni, 2021','replied'],
    ['Ana Ruiz','Fernwood Foods · COO','Dan knows her','not contacted'],
  ]

  const nav = document.getElementById('nav')
  const pages = document.getElementById('pages')

  function show(id) {
    pages.innerHTML = ''
    pages.appendChild(document.getElementById('tpl-' + id).content.cloneNode(true))
    if (id === 'people') fillPeople()
    ;[...nav.children].forEach((b) => {
      const on = b.dataset.id === id
      b.className = 'w-full text-left flex items-center gap-3 rounded-lg px-3 py-2 text-sm transition-colors ' +
        (on ? 'bg-ink-700 text-accent-300 font-medium' : 'text-slate-400 hover:text-slate-200 hover:bg-ink-800')
    })
    pages.querySelectorAll('[data-go]').forEach((el) =>
      el.addEventListener('click', () => show(el.dataset.go)))
    location.hash = id
  }

  function fillPeople() {
    const rows = document.getElementById('people-rows')
    rows.innerHTML = PEOPLE.map(([name, where, tie, stage]) => `
      <tr class="border-b border-ink-800 last:border-0 hover:bg-ink-800/40">
        <td class="px-4 py-2.5 text-slate-200">${name}</td>
        <td class="px-4 py-2.5 text-slate-400">${where}</td>
        <td class="px-4 py-2.5"><span class="chip">${tie}</span></td>
        <td class="px-4 py-2.5"><span class="text-xs ${STAGE[stage] || 'text-slate-400'}">${stage}</span></td>
        <td class="px-4 py-2.5 text-right">
          <button class="text-xs text-accent-300 hover:text-accent-400" data-go="door">Find a path</button>
        </td>
      </tr>`).join('')
    rows.querySelectorAll('[data-go]').forEach((el) =>
      el.addEventListener('click', () => show(el.dataset.go)))
  }

  nav.innerHTML = PAGES.map((p) => `
    <button data-id="${p.id}">
      <span>${p.label}</span>
      ${p.badge ? `<span class="ml-auto rounded-full bg-accent-500/20 px-1.5 py-0.5 text-[11px] font-semibold text-accent-300">${p.badge}</span>` : ''}
    </button>`).join('')
  ;[...nav.children].forEach((b) => b.addEventListener('click', () => show(b.dataset.id)))

  show((location.hash || '#today').slice(1))
</script>
</body>
</html>
